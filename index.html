<style>
  /* Layout: a navy harbour band (brand row, headline, small ship on the water) that the input desk overlaps;
     below it one working column — readout, recent lookups, then the searchable carrier directory. */
  :root {
    --bg: #EDF1F3;
    --surface: #FFFFFF;
    --surface-2: #F5F8F9;
    --ink: #13232E;
    --muted: #5A6A74;
    --line: #D4DCE1;
    --band: #15314A;
    --band-2: #1B3C58;
    --band-ink: #EAF2F7;
    --band-accent: #F4A27C;
    --accent: #C4502B;
    --accent-ink: #FFFFFF;
    --focus: #1F7A96;
    --ok: #2C7A4C;
    --ok-soft: #DDF0E3;
    --warn: #9A6514;
    --warn-soft: #F6EAD2;
    --bad: #B0382B;
    --bad-soft: #F7DEDA;
    --shadow: rgba(19, 35, 46, .28);
    --box-shade: rgba(0, 0, 0, .22);

    /* container paint colours, used for carrier badges and the ship's stack */
    --p1: #3A8BBF; --p2: #E06D27; --p3: #24457E; --p4: #B9942C; --p5: #2F8B68;
    --p6: #B0382B; --p7: #6A4C93; --p8: #1F8A8A; --p9: #7D6A52; --p10: #C2457C;
    --c-none: #8D9AA3;

    --sky1: #A9DAEA;
    --sky2: #EEF8FA;
    --sun: #FFD27A;
    --sun-glow: rgba(255, 210, 122, .55);
    --cloud: #FFFFFF;
    --sea1: #3A93B3;
    --sea2: #1D6886;
    --sea3: #134A63;
    --foam: rgba(255, 255, 255, .75);
    --hull: #1C3247;
    --hull-top: #2D4A63;
    --house: #F4F6F7;
    --house-roof: #D3DADF;
    --window: #2C4A60;
    --smoke: #C9D3D9;
    --intro-ink: #13324A;
    --art-hull: #DCE6EC;
    --art-hull-top: #F6FAFC;
    --art-sea: #24557A;
    --art-crest: rgba(160, 214, 236, .7);

    --font-display: "Saira Stencil One", "Arial Narrow", Impact, sans-serif;
    --font-body: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, Consolas, "SFMono-Regular", monospace;
  }
  :root[lang="ja"] { --font-body: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, system-ui, sans-serif; }
  :root[lang="en"] { --font-body: "Noto Sans SC", system-ui, -apple-system, "Segoe UI", sans-serif; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0C161D; --surface: #13212B; --surface-2: #182A36; --ink: #E2EBF0; --muted: #93A5B0; --line: #253945;
      --band: #0F2638; --band-2: #143049; --band-ink: #E2EEF5; --accent: #E0693F; --accent-ink: #FFFFFF;
      --focus: #5BB4D0; --ok: #6CC795; --ok-soft: #173326; --warn: #E2B25A; --warn-soft: #36290F; --bad: #F08A7C; --bad-soft: #3B1C18;
      --shadow: rgba(0, 0, 0, .6); --box-shade: rgba(0, 0, 0, .3);
      --p1: #4FA1D4; --p2: #EE8240; --p3: #4A6FB0; --p4: #CCA640; --p5: #3FA37E;
      --p6: #D4594B; --p7: #8F70BA; --p8: #33A6A6; --p9: #A08868; --p10: #D9619A; --c-none: #6D7C86;
      --sky1: #0B1D2E; --sky2: #1F4560; --sun: #EDE6C9; --sun-glow: rgba(237, 230, 201, .25); --cloud: #2E4C62;
      --sea1: #1E5672; --sea2: #133F57; --sea3: #0B2B3D; --foam: rgba(210, 232, 243, .45);
      --hull: #2F4B64; --hull-top: #45657F; --house: #D5DDE2; --house-roof: #A9B6BE; --window: #F2D27C; --smoke: #6F8796;
      --intro-ink: #E6F0F6; --art-sea: #1A4462;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0C161D; --surface: #13212B; --surface-2: #182A36; --ink: #E2EBF0; --muted: #93A5B0; --line: #253945;
    --band: #0F2638; --band-2: #143049; --band-ink: #E2EEF5; --accent: #E0693F; --accent-ink: #FFFFFF;
    --focus: #5BB4D0; --ok: #6CC795; --ok-soft: #173326; --warn: #E2B25A; --warn-soft: #36290F; --bad: #F08A7C; --bad-soft: #3B1C18;
    --shadow: rgba(0, 0, 0, .6); --box-shade: rgba(0, 0, 0, .3);
    --p1: #4FA1D4; --p2: #EE8240; --p3: #4A6FB0; --p4: #CCA640; --p5: #3FA37E;
    --p6: #D4594B; --p7: #8F70BA; --p8: #33A6A6; --p9: #A08868; --p10: #D9619A; --c-none: #6D7C86;
    --sky1: #0B1D2E; --sky2: #1F4560; --sun: #EDE6C9; --sun-glow: rgba(237, 230, 201, .25); --cloud: #2E4C62;
    --sea1: #1E5672; --sea2: #133F57; --sea3: #0B2B3D; --foam: rgba(210, 232, 243, .45);
    --hull: #2F4B64; --hull-top: #45657F; --house: #D5DDE2; --house-roof: #A9B6BE; --window: #F2D27C; --smoke: #6F8796;
    --intro-ink: #E6F0F6; --art-sea: #1A4462;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.6 var(--font-body);
  }
  .gutter {
    max-width: 920px;
    margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  /* ---------- header band ---------- */
  .band {
    background:
      radial-gradient(120% 140% at 85% 0%, var(--band-2), transparent 60%),
      var(--band);
    color: var(--band-ink);
  }
  .band-top {
    display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap;
    padding-block: 18px 16px;
    border-bottom: 1px solid color-mix(in srgb, var(--band-ink) 12%, transparent);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand-mark { width: 36px; height: 36px; flex: none; border-radius: 9px; }
  .brand-name { display: block; font-size: 16px; font-weight: 700; letter-spacing: .02em; line-height: 1.25; }
  .brand .tag { display: block; font-family: var(--font-display); font-size: 11px; letter-spacing: .24em; opacity: .65; }
  .lang {
    display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--band-ink) 28%, transparent);
  }
  .lang button {
    background: transparent; color: var(--band-ink); border: 0; cursor: pointer;
    padding: 5px 12px; border-radius: 999px; font: 500 13px/1.3 var(--font-body);
  }
  .lang button:hover { background: color-mix(in srgb, var(--band-ink) 12%, transparent); }
  .lang button[aria-pressed="true"] { background: var(--band-ink); color: var(--band); }

  .hero {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px 40px; align-items: end;
    padding-block: 38px 92px;
  }
  .hero h1 { margin: 0; font-size: clamp(26px, 3.7vw, 40px); line-height: 1.2; font-weight: 700; letter-spacing: .01em; text-wrap: balance; max-width: 16em; }
  .lede { margin: 12px 0 0; font-size: 15.5px; line-height: 1.7; max-width: 38em; opacity: .84; }
  .facts { list-style: none; margin: 20px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .facts li {
    font-size: 13px; padding: 5px 13px; border-radius: 999px;
    border: 1px solid color-mix(in srgb, var(--band-ink) 22%, transparent);
    background: color-mix(in srgb, var(--band-ink) 6%, transparent);
  }
  .facts b { color: var(--band-accent); font-family: var(--font-mono); font-weight: 600; margin-right: 2px; }

  .hero-art { position: relative; width: 270px; height: 150px; margin-bottom: -6px; }
  .hero-art .ship { position: absolute; left: 22px; bottom: 26px; width: 225px; height: auto; transform-origin: 50% 82%; animation: bob 3.2s ease-in-out infinite alternate; }
  .hero-art .ship .hull { fill: var(--art-hull); }
  .hero-art .ship .hull-top { fill: var(--art-hull-top); }
  .hero-art .sea {
    position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 44px;
    -webkit-mask-image: radial-gradient(ellipse 58% 120% at 50% 0%, #000 55%, transparent 100%);
    mask-image: radial-gradient(ellipse 58% 120% at 50% 0%, #000 55%, transparent 100%);
  }
  .hero-art .sea .fill { fill: var(--art-sea); }
  .hero-art .sea .crest { fill: none; stroke: var(--art-crest); stroke-width: 1.6; }

  .band-wave { display: block; width: 100%; height: 14px; margin-top: -1px; }
  .band-wave path { fill: var(--band); }

  main.gutter { padding-block: 0 40px; display: grid; gap: 34px; }

  /* ---------- input desk ---------- */
  .desk {
    position: relative; margin-top: -78px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 22px;
    display: grid;
    gap: 14px;
    box-shadow: 0 24px 44px -28px var(--shadow);
  }
  .desk-label { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .desk-label label { font-weight: 700; font-size: 15px; }
  .keys { font-size: 12.5px; color: var(--muted); }
  kbd {
    font-family: var(--font-mono); font-size: 11.5px; padding: 1px 6px; border-radius: 4px;
    border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
  }
  .field { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; }
  #q {
    flex: 1 1 320px; min-width: 0;
    font: 600 20px/1.45 var(--font-mono); letter-spacing: .05em;
    padding: 14px 16px; border: 2px solid var(--line); border-radius: 10px;
    background: var(--surface-2); color: var(--ink);
    resize: none; min-height: 60px; max-height: 260px; overflow-y: auto;
    text-transform: uppercase;
  }
  #q::placeholder { text-transform: none; font: 400 15px/1.6 var(--font-body); letter-spacing: 0; color: var(--muted); }
  #q:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 4px color-mix(in srgb, var(--focus) 18%, transparent); }
  .field .btn { flex: none; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 18px; border-radius: 10px; border: 1px solid transparent;
    font: 600 15px/1.2 var(--font-body); text-decoration: none; cursor: pointer;
    background: transparent; color: var(--ink);
    transition: transform .12s ease, filter .12s ease, background-color .12s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn.ghost { border-color: var(--line); }
  .btn.ghost:hover { background: var(--surface-2); }
  .btn.small { padding: 8px 12px; font-size: 13.5px; border-radius: 8px; }
  .btn .arrow { font-family: var(--font-mono); font-weight: 400; }
  .linkish { background: none; border: 0; padding: 0; color: var(--focus); font: inherit; font-size: 13.5px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

  /* ---------- readout ---------- */
  .readout { border-top: 1px dashed var(--line); padding-top: 16px; display: grid; gap: 12px; }
  .ro-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .ro-name { font-size: 17px; font-weight: 700; }
  .pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { font-size: 12px; line-height: 1.5; padding: 2px 9px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
  .pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  .pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }

  .num { font: 600 24px/1.3 var(--font-mono); letter-spacing: .06em; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; overflow-wrap: anywhere; }
  .num.sm { font-size: 15px; gap: 6px; }
  .cd { display: inline-grid; place-items: center; min-width: 1.45em; height: 1.45em; padding: 0 .18em; border: 2px solid currentColor; border-radius: 3px; line-height: 1; }
  .cd.bad { color: var(--bad); }
  .ro-note { margin: 0; font-size: 14px; color: var(--muted); }
  .ro-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .ro-hint { margin: 0; font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: flex-start; }
  .ro-hint::before { content: ""; flex: none; width: 8px; height: 8px; margin-top: 6px; border-radius: 2px; background: var(--hint-c, var(--muted)); }
  .ro-hint.auto { --hint-c: var(--ok); }
  .ro-hint.copy { --hint-c: var(--warn); }

  .idle { display: grid; gap: 8px; color: var(--muted); font-size: 14px; }
  .idle .demo { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--ink); }
  .idle .demo .to { color: var(--muted); }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .chips .lbl { font-size: 13px; color: var(--muted); }
  .chip {
    display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px 6px 8px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
    font: 500 13.5px/1.2 var(--font-body);
  }
  .chip:hover { border-color: var(--focus); }
  .chip.mono { font-family: var(--font-mono); font-size: 13px; padding-left: 11px; }

  .pick { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .pick select, .dir-tools input {
    font: 500 14px/1.3 var(--font-body); color: var(--ink); background: var(--surface);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-width: 0; max-width: 100%;
  }
  .pick select:focus, .dir-tools input:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 18%, transparent); }

  .badge { display: inline-flex; align-items: center; gap: 8px; }
  .box {
    --c: var(--c-none);
    width: 30px; height: 18px; flex: none; border-radius: 2px;
    background-color: var(--c);
    background-image: repeating-linear-gradient(90deg, transparent 0 3px, var(--box-shade) 3px 4px);
    box-shadow: inset 0 0 0 1.5px var(--box-shade);
  }
  .box.sm { width: 22px; height: 13px; }

  /* ---------- batch ---------- */
  .batch-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .batch-head p { margin: 0; font-size: 14px; color: var(--muted); }
  .batch-head strong { color: var(--ink); }
  .rows { list-style: none; margin: 0; padding: 0; display: grid; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .row {
    display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) auto; gap: 8px 14px; align-items: center;
    padding: 12px 14px; border-top: 1px solid var(--line); background: var(--surface);
  }
  .row:first-child { border-top: 0; }
  .row.opened { background: var(--surface-2); }
  .row .who { display: grid; gap: 4px; min-width: 0; }
  .row .name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .row .act { display: flex; justify-content: flex-end; gap: 8px; align-items: center; }
  .row .pick, .row .chips { grid-column: 1 / -1; }
  .done-mark { font-size: 12.5px; color: var(--ok); white-space: nowrap; }

  /* ---------- sections ---------- */
  .sec-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  section h2 { margin: 0; font-size: 16px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  section h2 .eyebrow { font-family: var(--font-display); font-weight: 400; font-size: 12px; letter-spacing: .2em; color: var(--muted); }
  .count { font: 600 12px/1.6 var(--font-mono); color: var(--muted); padding: 0 8px; border: 1px solid var(--line); border-radius: 999px; }
  .fine { font-size: 12.5px; color: var(--muted); margin: 8px 2px 0; }

  .dir-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .dir-tools input { width: 220px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
  .seg button { border: 0; background: transparent; color: var(--muted); font: 500 13px/1.3 var(--font-body); padding: 8px 11px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); font-weight: 600; }

  .dir { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: 10px; }
  .dir a {
    display: grid; gap: 6px; height: 100%; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none;
    transition: border-color .12s ease, transform .12s ease;
  }
  .dir a:hover { border-color: var(--focus); transform: translateY(-1px); }
  .card-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .card-top .cname { font-weight: 600; font-size: 14px; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .card-pre { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); line-height: 1.6; overflow-wrap: anywhere; }
  .card-go { font-size: 12.5px; color: var(--focus); }
  .dir-empty { grid-column: 1 / -1; padding: 16px; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); font-size: 14px; }
  .dir-more { display: flex; justify-content: center; margin-top: 12px; }

  .log { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
  .log li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 12px; border-top: 1px solid var(--line); }
  .log li:first-child { border-top: 0; }
  .log time { font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .log .lnum { background: none; border: 0; padding: 0; color: var(--ink); font: 600 14px/1.3 var(--font-mono); letter-spacing: .03em; text-align: left; cursor: pointer; overflow-wrap: anywhere; }
  .log .lnum:hover { color: var(--focus); }

    note_lessor: '这是租赁公司的箱子，箱号看不出承运船社。请选一家船社打开，选过的会记住。',
    note_none: '没能从格式判断船社，请手动选择。',
    note_guess8: '8 位纯数字，推测是 Hapag-Lloyd 的订舱号。',
    note_guess9: '9 位纯数字，推测是 Maersk 的提单号或订舱号。',
    note_guess10: '10 位纯数字，通常是 COSCO 或 OOCL。',
    note_guess12: '12 位纯数字，推测是长荣的提单号。',
    note_guessOne: '12 位、末尾 6 位是数字，推测是去掉 ONEY 前缀的 ONE 提单号（也可能是 Hapag-Lloyd）。',
    note_guessHapag: '12 位字母数字，推测是去掉 HLCU 前缀的 Hapag-Lloyd 提单号（也可能是 ONE）。',
    note_guessYm: '1 个字母加 9 位数字，推测是阳明的提单号。',
    note_guessCma: '3 个字母加 7 位数字，多数是 CMA CGM，少数是 ZIM。',
    note_guessZim: '3 个字母加 4–6 位数字，推测是 ZIM 的提单号。',
    note_fmt_wanhai: '万海提单号格式：3 位数字 + 1 个字母 + 6 位数字。',
    note_fmt_sitc: '以 SIT 开头，是海丰（SITC）的提单号。',
    alsoMaybe: '也可能是：',
    goAuto: '在 {name} 官网查询', goCopy: '复制单号并打开 {name}', goAutoSm: '查询', goCopySm: '复制并打开',
    copyAlt: '复制为 {n}', changeCarrier: '不是这家？改选船社',
    pickOpen: '用哪家打开', changeTo: '改为', selectPh: '选择船社…',
    batchHead: '共 <strong>{n}</strong> 个单号，已识别 <strong>{k}</strong> 个。浏览器一次只允许打开一个新标签页，请逐个打开。',
    openNext: '打开下一个', opened: '已打开', allOpened: '已识别的单号都打开过了。',
    toastAuto: '已打开 {name}，单号也复制好了。',
    toastNoInput: '先输入或粘贴一个单号。', toastNoCarrier: '还没确定船社，请在下面选一家。',
    toastBlocked: '浏览器拦截了自动打开，按 Enter 或点下面的按钮即可。',
    toastCopied: '已复制 {n}', toastReduced: '系统开启了“减少动态效果”，动画不会播放。',
    logEmpty: '还没有查询记录。点下面的示例单号看看识别效果（虚构号码，只用来演示，最后两个分别演示校验位出错和纯数字提单号）。',
    fillTitle: '填入输入框', clearLog: '清空记录',
    hint_auto: '官网会自动带入单号并查询。',
    hint_unverified: '会尝试自动带入单号。官网可能先弹安全验证，过了之后如果输入框是空的，按 Ctrl+V 粘贴即可。',
    hint_copy: '官网不支持网址带单号。单号已复制，在输入框按 Ctrl+V 再查询。',
    tip_msc: '先选 Container/Bill of Lading Number。', tip_wanhai: '先在下拉框选好查询类型。', tip_evergreen: '先选好 B/L No.、Container No. 或 Booking No.。'
  }
};
</script>

<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  var prefs = Object.assign({ intro: true, autoPaste: true, lang: 'en' }, store.get('ct.prefs', {}));
  if (!I18N[prefs.lang]) prefs.lang = 'en';
  var history = store.get('ct.history', []);
  if (!Array.isArray(history)) history = [];
  var overrides = store.get('ct.overrides', {}) || {};
  var opened = {}, results = [];
  var dirState = { q: '', filter: 'all', expanded: false };
  var DIR_PREVIEW = 9;

  var q = $('#q'), readout = $('#readout');
  var EXAMPLES = ['MRKU4821076', 'ONEU7305121', 'HLXU2310542', 'CMAU7302917', 'MSCU7351024', 'CBHU7305620', 'WHLU5590317', '036C512345', 'TGHU8820148', 'MSKU1234567', '6123456789'];

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function t(key, vars) {
    var s = (I18N[prefs.lang] && I18N[prefs.lang][key]) || I18N.en[key] || key;
    if (vars) s = s.replace(/\{(\w+)\}/g, function (m, k) { return vars[k] != null ? vars[k] : m; });
    return s;
  }
  function cName(c) { return prefs.lang === 'zh' && c.zh ? c.name + ' ' + c.zh : c.name; }
  var SORTED = CARRIERS.slice().sort(function (a, b) { return a.name.localeCompare(b.name); });

  /* ---------- clipboard + toast ---------- */
  function copyText(text) {
    var fallback = function () {
      try {
        var ta = document.createElement('textarea');
        ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.top = '-1000px';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
      } catch (e) {}
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).catch(fallback);
      else fallback();
    } catch (e) { fallback(); }
  }
  var toastTimer;
  function toast(msg) {
    var el = $('#toast'); el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { el.classList.remove('show'); }, 4600);
  }

  /* ---------- small renderers ---------- */
  function boxHTML(c, sm) {
    return '<span class="box' + (sm ? ' sm' : '') + '" style="--c:' + (c ? 'var(--p' + c.p + ')' : 'var(--c-none)') + '"></span>';
  }
  function numHTML(r, sm) {
    var n = esc(r.num);
    if (r.type === 'container' || r.type === 'maybe') {
      return '<span class="num' + (sm ? ' sm' : '') + '"><span>' + n.slice(0, 4) + '</span><span>' + n.slice(4, 10) +
        '</span><span class="cd' + (r.check === false ? ' bad' : '') + '" title="' + esc(t('checkDigit')) + '">' + n[10] + '</span></span>';
    }
    return '<span class="num' + (sm ? ' sm' : '') + '">' + n + '</span>';
  }
  function pillsHTML(r) {
    var out = ['<span class="pill">' + esc(t('type_' + r.type)) + '</span>'];
    if (r.type === 'container' && r.check === true) out.push('<span class="pill ok">' + esc(t('chkOk')) + '</span>');
    if (r.type === 'container' && r.check === false) out.push('<span class="pill bad">' + esc(t('chkBad', { d: r.expected })) + '</span>');
    if (r.type === 'maybe') out.push('<span class="pill warn">' + esc(t('chkMaybe')) + '</span>');
    if (r.conf === 'guess') out.push('<span class="pill warn">' + esc(t('guess')) + '</span>');
    if (r.conf === 'manual') out.push('<span class="pill">' + esc(t('manual')) + '</span>');
    return '<span class="pills">' + out.join('') + '</span>';
  }
  function carrierName(r) {
    var c = BY_ID[r.carrier];
    if (c) return cName(c);
    if (r.lessor) return t('lessor');
    return t('unknownCarrier');
  }
  function noteText(r) {
    if (r.note === 'short') return t('note_short');
    if (r.lessor && !r.carrier) return t('note_lessor');
    if (!r.carrier) return t('note_none');
    if (r.note && (r.conf === 'guess' || r.note.indexOf('fmt_') === 0)) return t('note_' + r.note);
    return '';
  }
  function selectHTML(r, labelKey) {
    var h = '<label class="pick"><span>' + esc(t(labelKey)) + '</span><select data-pick-select="' + esc(r.num) + '">' +
      '<option value="">' + esc(t('selectPh')) + '</option>';
    SORTED.forEach(function (c) { h += '<option value="' + c.id + '"' + (c.id === r.carrier && r.conf === 'manual' ? ' selected' : '') + '>' + esc(cName(c)) + '</option>'; });
    return h + '</select></label>';
  }
  function candChips(r) {
    var others = r.cands.filter(function (id) { return id !== r.carrier; });
    if (!others.length) return '';
    return '<div class="chips" data-for="' + esc(r.num) + '"><span class="lbl">' + esc(t('alsoMaybe')) + '</span>' +
      others.map(function (id) { var c = BY_ID[id]; return '<button type="button" class="chip" data-pick="' + id + '">' + boxHTML(c, true) + esc(cName(c)) + '</button>'; }).join('') + '</div>';
  }
  function goHTML(r, small) {
    var c = BY_ID[r.carrier], l = linkFor(r);
    if (!c || !l) return '';
    var key = l.auto ? (small ? 'goAutoSm' : 'goAuto') : (small ? 'goCopySm' : 'goCopy');
    return '<a class="btn ' + (small ? 'small ' : '') + 'primary" data-go="' + esc(r.num) + '" data-carrier="' + c.id +
      '" href="' + esc(l.href) + '" target="_blank" rel="noopener">' + esc(t(key, { name: cName(c) })) + ' <span class="arrow">↗</span></a>';
  }
  function hintFor(r) {
    var c = BY_ID[r.carrier], l = linkFor(r);
    var s = l.auto ? (l.verified ? t('hint_auto') : t('hint_unverified')) : t('hint_copy');
    if (!l.auto && c.tip) s += ' ' + t(c.tip);
    return { text: s, cls: l.auto ? 'auto' : 'copy' };
  }

  /* ---------- readout ---------- */
  function render() {
    var nums = parseNumbers(q.value);
    results = nums.map(function (n) { return detect(n, overrides[n]); });
    if (!nums.length) return renderIdle();
    if (nums.length === 1) return renderSingle(results[0]);
    renderBatch(results);
  }

  function renderIdle() {
    readout.innerHTML =
      '<div class="idle"><span>' + esc(t('idleLead')) + '</span>' +
      '<div class="demo">' + numHTML({ num: 'MRKU4821076', type: 'container', check: true }) +
      '<span class="to">→</span><span class="badge">' + boxHTML(BY_ID.maersk) + '<strong>Maersk</strong></span>' +
      '<span class="pill ok">' + esc(t('chkOk')) + '</span></div></div>';
  }

  function renderSingle(r) {
    var c = BY_ID[r.carrier];
    var h = '<div class="ro-head"><span class="badge">' + boxHTML(c) + '<span class="ro-name">' + esc(carrierName(r)) + '</span></span>' + pillsHTML(r) + '</div>';
    h += numHTML(r);
    var note = noteText(r);
    if (note) h += '<p class="ro-note">' + esc(note) + '</p>';
    if (c) {
      var qa = queryFor(r);
      h += '<div class="ro-actions">' + goHTML(r) +
        (qa.alt ? '<button type="button" class="btn ghost small" data-copy="' + esc(qa.alt) + '">' + esc(t('copyAlt', { n: qa.alt })) + '</button>' : '') +
        '<button type="button" class="linkish" data-toggle-pick>' + esc(t('changeCarrier')) + '</button></div>';
      h += candChips(r);
      var hint = hintFor(r);
      h += '<p class="ro-hint ' + hint.cls + '">' + esc(hint.text) + '</p>';
      h += '<div data-pick-slot hidden>' + selectHTML(r, 'changeTo') + '</div>';
    } else if (r.note !== 'short') {
      h += selectHTML(r, 'pickOpen');
    }
    readout.innerHTML = h;
  }

  function renderBatch(list) {
    var known = list.filter(function (r) { return r.carrier; }).length;
    var h = '<div class="batch-head"><p>' + t('batchHead', { n: list.length, k: known }) + '</p>' +
      '<button type="button" class="btn primary small" id="nextBtn">' + esc(t('openNext')) + ' <span class="arrow">↗</span></button></div><ul class="rows">';
    list.forEach(function (r) {
      var c = BY_ID[r.carrier];
      h += '<li class="row' + (opened[r.num] ? ' opened' : '') + '">' +
        '<div class="who">' + numHTML(r, true) + pillsHTML(r) + '</div>' +
        '<div class="name">' + boxHTML(c, true) + '<span>' + esc(carrierName(r)) + '</span></div>' +
        '<div class="act">' + (opened[r.num] ? '<span class="done-mark">' + esc(t('opened')) + '</span>' : '') + goHTML(r, true) + '</div>' +
        (!c && r.note !== 'short' ? selectHTML(r, 'pickOpen') : candChips(r)) +
        '</li>';
    });
    readout.innerHTML = h + '</ul>';
  }

  /* ---------- open / history ---------- */
  function afterOpen(r) {
    var c = BY_ID[r.carrier], l = linkFor(r);
    copyText(queryFor(r).q);
    opened[r.num] = true;
    history = history.filter(function (x) { return x.n !== r.num; });
    history.unshift({ n: r.num, c: r.carrier, t: Date.now() });
    history = history.slice(0, 30);
    store.set('ct.history', history);
    renderLog();
    toast(l.auto ? t('toastAuto', { name: cName(c) }) : hintFor(r).text);
    if (results.length > 1) setTimeout(render, 50);
  }

  function resultFromLink(a) {
    var num = a.getAttribute('data-go'), cid = a.getAttribute('data-carrier');
    var r = detect(num, overrides[num] || cid);
    if (r.carrier !== cid) r = detect(num, cid);
    return r;
  }

  function setOverride(num, id) {
    overrides[num] = id;
    var keys = Object.keys(overrides);
    if (keys.length > 300) delete overrides[keys[0]];
    store.set('ct.overrides', overrides);
    render();
  }

  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[data-go]');
    if (a) { afterOpen(resultFromLink(a)); return; }
    var pick = e.target.closest('[data-pick]');
    if (pick) { setOverride(pick.closest('[data-for]').getAttribute('data-for'), pick.getAttribute('data-pick')); return; }
    if (e.target.closest('[data-toggle-pick]')) {
      var slot = readout.querySelector('[data-pick-slot]');
      if (slot) { slot.hidden = !slot.hidden; if (!slot.hidden) { var s = slot.querySelector('select'); if (s) s.focus(); } }
      return;
    }
    var cp = e.target.closest('[data-copy]');
    if (cp) { copyText(cp.getAttribute('data-copy')); toast(t('toastCopied', { n: cp.getAttribute('data-copy') })); return; }
    if (e.target.closest('#nextBtn')) { openNext(); return; }
    var fill = e.target.closest('[data-fill]');
    if (fill) { q.value = fill.getAttribute('data-fill'); autosize(); render(); q.focus(); return; }
    var lb = e.target.closest('[data-lang]');
    if (lb) { setLang(lb.getAttribute('data-lang')); return; }
    var fb = e.target.closest('[data-filter]');
    if (fb) { dirState.filter = fb.getAttribute('data-filter'); renderDirectory(); return; }
  });

  document.addEventListener('change', function (e) {
    var s = e.target.closest('select[data-pick-select]');
    if (s && s.value) setOverride(s.getAttribute('data-pick-select'), s.value);
  });

  function openNext() {
    var links = readout.querySelectorAll('a[data-go]');
    for (var i = 0; i < links.length; i++) {
      if (!opened[links[i].getAttribute('data-go')]) { links[i].click(); return; }
    }
    toast(t('allOpened'));
  }

  /* ---------- input behaviour ---------- */
  function autosize() { q.style.height = 'auto'; q.style.height = Math.min(q.scrollHeight + 4, 260) + 'px'; }
  q.addEventListener('input', function () { autosize(); render(); });

  q.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      if (!results.length) { toast(t('toastNoInput')); return; }
      if (results.length === 1) {
        var a = readout.querySelector('a[data-go]');
        if (a) a.click(); else toast(t('toastNoCarrier'));
      } else openNext();
    } else if (e.key === 'Escape') {
      q.value = ''; autosize(); render();
    }
  });

  var framed = (function () { try { return window.self !== window.top; } catch (e) { return true; } })();
  $('#framedNote').hidden = !framed;

  q.addEventListener('paste', function (e) {
    if (!prefs.autoPaste || framed) return;
    var text = (e.clipboardData && e.clipboardData.getData('text')) || '';
    var replacesAll = !q.value.trim() || (q.selectionStart === 0 && q.selectionEnd === q.value.length);
    if (!replacesAll) return;
    var nums = parseNumbers(text);
    if (nums.length !== 1) return;
    var r = detect(nums[0], overrides[nums[0]]);
    if (!r.carrier || (r.conf !== 'sure' && r.conf !== 'manual')) return;
    var w = null;
    try { w = window.open(linkFor(r).href, '_blank'); } catch (err) { w = null; }
    if (w) { try { w.opener = null; } catch (err2) {} afterOpen(r); }
    else setTimeout(function () { toast(t('toastBlocked')); }, 60);
  });

  $('#clearBtn').addEventListener('click', function () { q.value = ''; autosize(); render(); q.focus(); });

  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || '')) {
      e.preventDefault(); q.focus();
    }
  });

  /* ---------- carrier directory ---------- */
  var dirSearch = $('#dirSearch');
  dirSearch.addEventListener('input', function () { dirState.q = dirSearch.value.trim().toUpperCase(); renderDirectory(); });
  $('#dirMore').addEventListener('click', function () { dirState.expanded = !dirState.expanded; renderDirectory(); });

  function renderDirectory() {
    var qy = dirState.q;
    var list = CARRIERS.filter(function (c) {
      var m = modeOf(c);
      if (dirState.filter === 'auto' && m === 'copy') return false;
      if (dirState.filter === 'copy' && m !== 'copy') return false;
      if (!qy) return true;
      var hay = (c.name + ' ' + (c.zh || '') + ' ' + c.cntr.join(' ') + ' ' + c.scac.join(' ')).toUpperCase();
      return hay.indexOf(qy) > -1;
    });
    var limited = !qy && dirState.filter === 'all' && !dirState.expanded;
    var shown = limited ? list.slice(0, DIR_PREVIEW) : list;
    var h = '';
    shown.forEach(function (c) {
      var m = modeOf(c), cls = m === 'copy' ? '' : (m === 'unverified' ? ' warn' : ' ok');
      var pre = c.cntr.length ? c.cntr.join(' ') : (c.scac.length ? 'B/L ' + c.scac.join(' ') : '—');
      h += '<li><a href="' + esc(c.page) + '" target="_blank" rel="noopener">' +
        '<span class="card-top">' + boxHTML(c, true) + '<span class="cname">' + esc(cName(c)) + '</span><span class="pill' + cls + '">' + esc(t('m_' + m)) + '</span></span>' +
        '<span class="card-pre">' + esc(pre) + '</span>' +
        '<span class="card-go">' + esc(t('openPage')) + '</span></a></li>';
    });
    if (!shown.length) h = '<li class="dir-empty">' + esc(t('noMatch')) + '</li>';
    $('#dirList').innerHTML = h;
    $('#dirCount').textContent = String(CARRIERS.length);
    var more = $('#dirMore');
    more.hidden = !!qy || dirState.filter !== 'all';
    more.textContent = dirState.expanded ? t('showLess') : t('showAll', { n: CARRIERS.length });
    document.querySelectorAll('[data-filter]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-filter') === dirState.filter)); });
  }

  /* ---------- log ---------- */
  function fmtTime(ts) {
    var d = new Date(ts), p = function (n) { return (n < 10 ? '0' : '') + n; };
    return p(d.getMonth() + 1) + '/' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function renderLog() {
    var box = $('#logBox');
    if (!history.length) {
      var chips = EXAMPLES.map(function (n) { return '<button type="button" class="chip mono" data-fill="' + n + '">' + n + '</button>'; }).join('');
      box.innerHTML = '<div class="log-empty"><span>' + esc(t('logEmpty')) + '</span><div class="chips">' + chips + '</div></div>';
      return;
    }
    var h = '<ul class="log">';
    history.forEach(function (it) {
      var r = detect(it.n, it.c), c = BY_ID[r.carrier];
      h += '<li><time>' + fmtTime(it.t) + '</time>' +
        '<button type="button" class="lnum" data-fill="' + esc(it.n) + '" title="' + esc(t('fillTitle')) + '">' + esc(it.n) +
        '<span class="lc">' + (c ? esc(cName(c)) : '') + '</span></button>' + goHTML(r, true) + '</li>';
    });
    box.innerHTML = h + '</ul><div class="log-tools"><button type="button" class="linkish" id="clearLog">' + esc(t('clearLog')) + '</button></div>';
    $('#clearLog').addEventListener('click', function () { history = []; store.set('ct.history', history); renderLog(); });
  }

  /* ---------- language ---------- */
  function applyStatic() {
    document.documentElement.lang = ({ en: 'en', ja: 'ja', zh: 'zh-CN' })[prefs.lang];
    document.title = t('docTitle');
    document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t(el.getAttribute('data-i18n')); });
    document.querySelectorAll('[data-i18n-html]').forEach(function (el) { el.innerHTML = t(el.getAttribute('data-i18n-html')); });
    document.querySelectorAll('[data-i18n-ph]').forEach(function (el) { el.setAttribute('placeholder', t(el.getAttribute('data-i18n-ph'))); });
    document.querySelectorAll('[data-lang]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-lang') === prefs.lang)); });
    var autoN = CARRIERS.filter(function (c) { return !!c.auto; }).length;
    $('#factCarriers').innerHTML = t('factCarriers', { n: CARRIERS.length });
    $('#factAuto').innerHTML = t('factAuto', { n: autoN });
  }
  function setLang(l) {
    if (!I18N[l] || l === prefs.lang) return;
    prefs.lang = l; store.set('ct.prefs', prefs);
    applyStatic(); renderDirectory(); renderLog(); render();
  }

  /* ---------- prefs ---------- */
  var pIntro = $('#prefIntro'), pPaste = $('#prefPaste');
  pIntro.checked = prefs.intro; pPaste.checked = prefs.autoPaste;
  pIntro.addEventListener('change', function () { prefs.intro = pIntro.checked; store.set('ct.prefs', prefs); });
  pPaste.addEventListener('change', function () { prefs.autoPaste = pPaste.checked; store.set('ct.prefs', prefs); });

  /* ---------- ship drawing ---------- */
  function drawShip(svg, pid, smoke) {
    var s = '<defs><pattern id="' + pid + '" width="4" height="20" patternUnits="userSpaceOnUse"><rect class="corr-line" x="3" width="1" height="20"/></pattern></defs>';
    if (smoke) s += '<circle class="puff p1" cx="50" cy="28" r="7"/><circle class="puff p2" cx="50" cy="28" r="6"/><circle class="puff p3" cx="50" cy="28" r="5"/>';
    s += '<rect class="house" x="42" y="32" width="16" height="28" rx="2"/><rect class="funnel-band" x="42" y="38" width="16" height="6"/>' +
      '<rect class="house" x="26" y="60" width="44" height="50" rx="2"/><rect class="roof" x="21" y="57" width="54" height="6" rx="1"/>';
    [[31, 68, 7], [41, 68, 7], [51, 68, 7], [61, 68, 5], [31, 80, 7], [41, 80, 7], [51, 80, 7]].forEach(function (w) {
      s += '<rect class="win" x="' + w[0] + '" y="' + w[1] + '" width="' + w[2] + '" height="5" rx="1"/>';
    });
    [[93, 78, 9], [76, 78, 8], [59, 106, 6]].forEach(function (tr, ti) {
      for (var i = 0; i < tr[2]; i++) {
        var x = tr[1] + i * 28, k = ((ti * 3 + i * 7 + (i % 2) * 2) % 10) + 1;
        s += '<rect x="' + x + '" y="' + tr[0] + '" width="26" height="15" rx="1" style="fill:var(--p' + k + ')"/>' +
          '<rect x="' + x + '" y="' + tr[0] + '" width="26" height="15" style="fill:url(#' + pid + ')"/>';
      }
    });
    s += '<path class="hull" d="M12 108 H352 L334 150 H38 Q21 146 12 108 Z"/><rect class="hull-top" x="12" y="106" width="340" height="4"/>' +
      '<path class="boot" d="M30 140 H338 L334 150 H38 Q33 147 30 140 Z"/>';
    svg.innerHTML = s;
  }
  drawShip($('#introShip'), 'corrIntro', true);
  drawShip($('#heroShip'), 'corrHero', false);

  /* ---------- intro ---------- */
  var intro = $('#intro'), introTimer = null;
  function closeIntro() {
    if (!document.documentElement.classList.contains('intro-on') || intro.classList.contains('done')) return;
    clearTimeout(introTimer);
    intro.classList.add('done');
    document.removeEventListener('keydown', closeIntro, true);
    setTimeout(function () { document.documentElement.classList.remove('intro-on'); intro.classList.remove('done'); }, 650);
    try { q.focus({ preventScroll: true }); } catch (e) {}
  }
  function startIntro() {
    document.documentElement.classList.add('intro-on');
    intro.classList.remove('done');
    ['.ship-track', '.title'].forEach(function (sel) {
      var el = intro.querySelector(sel); el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
    });
    clearTimeout(introTimer);
    introTimer = setTimeout(closeIntro, 3700);
    setTimeout(function () { document.addEventListener('keydown', closeIntro, true); }, 0);
  }
  intro.addEventListener('click', closeIntro);
  $('#replayIntro').addEventListener('click', function () {
    var reduce = false;
    try { reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    if (reduce) { toast(t('toastReduced')); return; }
    startIntro();
  });

  applyStatic();
  renderDirectory();
  renderLog();
  render();
  if (document.documentElement.classList.contains('intro-on')) startIntro();
  else q.focus({ preventScroll: true });
})();
</script>
